<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contest Tracker</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Contest Tracker</h1>

      <p class="subtitle">My competitive programming contest history</p>

      <table>
        <thead>
          <tr>
            <th>No.</th>
            <th>Date & Time</th>
            <th>Platform</th>
            <th>Contest Name</th>
            <th>Solved</th>
            <th>Rank</th>
          </tr>
        </thead>

        <tbody id="contest-table-body">
          <!-- Contest data will come here -->
        </tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
